<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Starting DSH…</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container { text-align: center; padding: 40px; width: 100%; max-width: 460px; }
        .logo {
            font-size: 48px; margin-bottom: 20px; font-weight: 700;
            background: linear-gradient(135deg, #1a73e8, #00bfa5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        h2 { font-size: 18px; font-weight: 400; color: #a0a0b0; margin-bottom: 24px; }
        .status { font-size: 13px; color: #888; margin-bottom: 16px; min-height: 18px; }

        /* 进度条 */
        .progress-track {
            width: 100%; height: 10px;
            background: #0f3460; border-radius: 5px;
            overflow: hidden; margin-bottom: 8px;
        }
        .progress-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #1a73e8, #00bfa5);
            border-radius: 5px;
            transition: width 0.2s ease;
        }
        .progress-text { font-size: 12px; color: #666; margin-bottom: 24px; }

        .steps { text-align: left; font-size: 13px; line-height: 2; }
        .steps span { display: block; }
        .steps .done { color: #00bfa5; }
        .steps .active { color: #1a73e8; }
        .steps .pending { color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">DSH</div>
        <h2 id="title">正在启动 DeepSeek Harness…</h2>
        <div class="status" id="status">初始化中</div>
        <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
        <div class="progress-text" id="pct">0%</div>
        <div class="steps" id="steps">
            <span class="pending" id="step1">○ 检查运行环境</span>
            <span class="pending" id="step2">○ 准备 DSH</span>
            <span class="pending" id="step3">○ 启动服务器</span>
        </div>
    </div>
    <script>
        const { ipcRenderer } = require('electron')
        const fill = document.getElementById('fill')
        const pct = document.getElementById('pct')
        const status = document.getElementById('status')
        const steps = {
            step1: document.getElementById('step1'),
            step2: document.getElementById('step2'),
            step3: document.getElementById('step3'),
        }

        function setStep(n, done, text) {
            const el = steps['step' + n]
            el.className = done ? 'done' : 'active'
            el.innerHTML = (done ? '✓ ' : '○ ') + text
        }

        ipcRenderer.on('boot-progress', (event, data) => {
            // data: { step: 1|2|3, done: bool, text: string, percent: 0-100 }
            if (data.step) setStep(data.step, !!data.done, data.text || '')
            if (data.text && !data.step) status.textContent = data.text
            if (typeof data.percent === 'number') {
                fill.style.width = data.percent + '%'
                pct.textContent = Math.round(data.percent) + '%'
            }
            if (data.stepText) status.textContent = data.stepText
        })
    </script>
</body>
</html>

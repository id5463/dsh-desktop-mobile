<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body {
 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
 background: #1a1a2e; color: #e0e0e0;
 display: flex; justify-content: center; padding: 24px;
 }.card { background: #16213e; border-radius: 12px; padding: 32px; max-width: 420px; width: 100%; text-align: center; }
 h1 { font-size: 20px; margin-bottom: 8px; color: #fff; }.subtitle { font-size: 13px; color: #a0a0b0; margin-bottom: 24px; }.code-box { background: #0f3460; border-radius: 8px; padding: 16px; margin-bottom: 20px; }.code { font-size: 32px; font-weight: 700; letter-spacing: 4px; color: #dc3545; font-family: monospace; }.hint { font-size: 11px; color: #666; margin-top: 8px; }.qr { margin: 16px auto; width: 200px; height: 200px; background: #fff; border-radius: 8px; padding: 8px; display: flex; align-items: center; justify-content: center; }.qr img { width: 100%; height: 100%; }.lan-info { background: #1a1a2e; border-radius: 6px; padding: 12px; margin-top: 16px; font-size: 12px; }.lan-info dt { color: #dc3545; font-weight: 600; margin-top: 8px; }.lan-info dt:first-child { margin-top: 0; }.lan-info dd { color: #a0a0b0; margin-left: 0; margin-top: 2px; word-break: break-all; }.status { margin-top: 16px; padding: 8px; border-radius: 6px; font-size: 13px; }.status.online { background: #1b5e20; color: #81c784; }.status.offline { background: #b71c1c; color: #ef9a9a; }
</style>
</head>
<body>
 <div class="card">
 <h1 id="connTitle">远程连接</h1>
 <p class="subtitle" id="connSubtitle">在 dshd Blue 中输入连接码，或扫描二维码</p>

 <div class="code-box">
 <div class="code" id="peerCode">---</div>
 <div class="hint" id="codeHint">在手机上输入此连接码</div>
 </div>

 <div class="qr">
 <img id="qrImage" src="" alt="QR Code" style="display:none">
 </div>
 <div class="hint" id="qrHint">或用手机扫描二维码</div>

 <div class="lan-info">
 <dt> <span id="lanLabel">局域网连接</span></dt>
 <dd id="lanUrl">---</dd>
 <dt> <span id="p2pLabel">P2P 连接码</span></dt>
 <dd><b id="peerCode2">---</b></dd>
 <dt> <span id="gwLabel">安全网关（文件传输 / 管理）</span></dt>
 <dd id="gwUrl">---</dd>
 <dd id="gwToken" style="font-family:monospace;font-size:11px;color:#81c784">---</dd>
 <dt> <span id="devicesLabel">已连接设备</span></dt>
 <dd id="phoneCount">0 台</dd>
 </div>

 <div class="status offline" id="statusBar"><span id="waitingLabel">等待手机连接…</span></div>
 </div>

 <script>
 const { ipcRenderer } = require('electron')

 const QRCode = require('qrcode')

 const params = new URLSearchParams(window.location.search)
 const fullPeerId = params.get('peerId') || '---'
 // 显示时去掉 "dsh-" 前缀，用户只需记/输随机码
 const shortCode = fullPeerId.replace(/^dsh-/i, '')
 document.getElementById('peerCode').textContent = shortCode
 document.getElementById('peerCode2').textContent = shortCode
 const lanUrl = params.get('lanUrl') || '---'
 document.getElementById('lanUrl').textContent = lanUrl

 // 安全网关信息 (集成 dsh-Remote): 手机浏览器可访问文件传输/管理页
 const gwUrl = params.get('gatewayUrl') || ''
 const gwToken = params.get('gatewayToken') || ''
 if (gwUrl) {
 document.getElementById('gwUrl').textContent = gwUrl + '/fs/list?token=' + gwToken
 document.getElementById('gwToken').textContent = 'Token: ' + gwToken
 document.getElementById('gwUrl').title = gwUrl + '/admin' + '?token=' + gwToken
 }

 const lang = params.get('lang') || 'zh'

 // 在页面内生成二维码 (携带 token, 手机扫码后直接通过鉴权门)
 const qrContainer = document.getElementById('qrImage')
 const qrData = JSON.stringify({ peerId: params.get('peerId'), url: lanUrl, token: gwToken })
 QRCode.toDataURL(qrData, { width: 200, margin: 2, color: { dark: '#dc3545', light: '#ffffff' } }).then(function(url) {
 qrContainer.src = url
 qrContainer.style.display = 'block'
 }).catch(function() { qrContainer.style.display = 'none' })
 const texts = {
 zh: { title: '远程连接', subtitle: '在 dshd Blue 中输入连接码，或扫描二维码', codeHint: '在手机上输入此连接码', qrHint: '或用手机扫描二维码', lan: '局域网连接', p2p: 'P2P 连接码', gw: '安全网关（文件传输 / 管理）', devices: '已连接设备', waiting: '等待手机连接…', connected: '已连接', unit: '台' },
 en: { title: 'Remote Connection', subtitle: 'Enter the connection code in dshd Blue, or scan the QR code', codeHint: 'Enter this code on your phone', qrHint: 'Or scan the QR code with your phone', lan: 'LAN Connection', p2p: 'P2P Connection Code', gw: 'Secure Gateway (files / admin)', devices: 'Connected Devices', waiting: 'Waiting for phone connection…', connected: 'Connected', unit: 'device(s)' },
 }
 const tx = texts[lang] || texts.zh
 document.getElementById('connTitle').textContent = tx.title
 document.getElementById('connSubtitle').textContent = tx.subtitle
 document.getElementById('codeHint').textContent = tx.codeHint
 document.getElementById('qrHint').textContent = tx.qrHint
 document.getElementById('lanLabel').textContent = tx.lan
 document.getElementById('p2pLabel').textContent = tx.p2p
 document.getElementById('gwLabel').textContent = tx.gw
 document.getElementById('devicesLabel').textContent = tx.devices
 document.getElementById('waitingLabel').textContent = tx.waiting

 // 移除旧的 p2p-status 监听（功能已移除）
 </script>
</body>
</html>

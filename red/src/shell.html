<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 html, body { height: 100%; overflow: hidden; }
 body {
 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
 background: transparent; /* 内容区透明, DSH UI 由 WebContentsView 绘制 */
 color: #e0e0e0;
 }
 /* ===== 左侧边栏 (dshd Red 红色主题) ===== */
 #sidebar {
 width: 220px; height: 100%; background: linear-gradient(180deg, #3a0d0d 0%, #2a0a0a 40%, #1a1016 100%);
 display: flex; flex-direction: column; padding: 0;
 border-right: 2px solid #dc3545;
 }.brand-block {
 background: linear-gradient(135deg, #dc3545, #8e1f2b);
 padding: 16px 14px 14px;
 }.brand { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 1px; }.brand.red { color: #ffd9d9; }.brand-sub { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; }.status-pill {
 margin: 12px 12px 10px; font-size: 12px; padding: 7px 10px; border-radius: 8px;
 background: #5c1616; color: #ffb4b4; display: flex; align-items: center; gap: 6px;
 border: 1px solid #dc3545;
 }.status-pill.online { background: #143d1f; color: #81c784; border-color: #28a745; }.status-pill.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
 nav { display: flex; flex-direction: column; gap: 3px; flex: 1; padding: 0 10px; }
 nav button {
 border: none; border-radius: 8px; padding: 10px 12px; font-size: 13px;
 color: #e8c8c8; background: transparent; cursor: pointer; text-align: left;
 display: flex; align-items: center; gap: 9px; transition: background 0.15s;
 }
 nav button:hover { background: #dc3545; color: #fff; }
 nav button:active { background: #b3261e; }.foot { font-size: 11px; color: #a07070; margin: 8px 14px 12px; line-height: 1.6; }
</style>
</head>
<body>
 <div id="sidebar">
 <div class="brand-block">
 <div class="brand">dshd <span class="red">Red</span></div>
 <div class="brand-sub">DeepSeek Harness 桌面端</div>
 </div>
 <div class="status-pill offline" id="statusPill"><span class="dot"></span><span id="statusText">DSH 未运行</span></div>
 <nav>
 <button data-act="conn">远程连接</button>
 <button data-act="providers">供应商管理</button>
 <button data-act="market">插件市场</button>
 <button data-act="isolation">对话隔离</button>
 <button data-act="yellow">整合包</button>
 <button data-act="extras">扩展管理</button>
 <button data-act="gateway">安全网关</button>
 <button data-act="guardian">守护 (Green)</button>
 <button data-act="migrate">迁移导入</button>
 <button data-act="restart">重启 DSH</button>
 </nav>
 <div class="foot" id="foot">会话: -<br>端口: -</div>
 </div>

 <script>
 // 壳侧栏: DSH UI 由主进程的 WebContentsView 绘制在内容区
 const shell = window.dshdShell
 const params = new URLSearchParams(window.location.search)
 const port = params.get('port') || '3080'
 const statusPill = document.getElementById('statusPill')
 const statusText = document.getElementById('statusText')
 const foot = document.getElementById('foot')

 document.querySelectorAll('nav button').forEach((b) => {
 b.onclick = () => shell.action(b.dataset.act)
 })

 shell.onStatus((st) => {
 if (st && typeof st.online === 'boolean') {
 const online = st.online
 statusPill.className = 'status-pill ' + (online ? 'online' : 'offline')
 statusText.textContent = online ? 'DSH 运行中 · ' + (st.running || 0) + ' 个会话' : 'DSH 未运行'
 foot.textContent = '会话: ' + (st.total != null ? st.total : '-') + ' · 端口: ' + (st.port || port)
 }
 })

 foot.textContent = '端口: ' + port
 </script>
</body>
</html>

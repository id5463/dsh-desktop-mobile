<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e; color: #e0e0e0; padding: 20px;
  }
  h1 { font-size: 18px; color: #fff; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #a0a0b0; margin-bottom: 14px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  button {
    border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px;
    color: #fff; cursor: pointer; background: #28a745;
  }
  button.secondary { background: #0f3460; }
  button.danger { background: #dc3545; }
  .out {
    background: #0f0f1e; border-radius: 8px; padding: 12px; font-family: monospace;
    font-size: 12px; color: #81c784; min-height: 260px; max-height: 420px;
    overflow-y: auto; white-space: pre-wrap; word-break: break-all;
  }
  .status { margin-top: 10px; font-size: 12px; color: #81c784; min-height: 16px; }
  .status.err { color: #ef9a9a; }
</style>
</head>
<body>
  <h1>🛟 守护者 / Guardian (dshd Green)</h1>
  <p class="subtitle">只读诊断 — 仅在你点击时运行, 绝不自动修改任何东西</p>

  <div class="toolbar">
    <button id="statusBtn">📡 状态</button>
    <button id="doctorBtn" class="secondary">🏥 健康检查</button>
    <button id="keyBtn" class="danger">🔑 识别 API Key</button>
    <button id="clearBtn" class="secondary">🧹 清空</button>
  </div>

  <div class="out" id="out">（点击上方按钮运行诊断）</div>
  <div class="status" id="status"></div>

  <script>
    const { ipcRenderer } = require('electron')
    const out = document.getElementById('out')

    async function run(cmd) {
      const r = await ipcRenderer.invoke('guardian-run', cmd)
      // 输出已通过 guardian-line 事件流入; 这里兜底渲染一次
      if (r && r.output && !out.textContent.includes('已运行')) out.textContent = r.output
    }

    ipcRenderer.on('guardian-line', (_e, line) => {
      // 追加行 (保留最近 200 行)
      const lines = (out.textContent + line).split('\n')
      out.textContent = lines.slice(-200).join('\n')
      out.scrollTop = out.scrollHeight
    })

    document.getElementById('statusBtn').onclick = () => { out.textContent = ''; run('status') }
    document.getElementById('doctorBtn').onclick = () => { out.textContent = ''; run('doctor') }
    document.getElementById('keyBtn').onclick = () => { out.textContent = ''; run('key') }
    document.getElementById('clearBtn').onclick = () => { out.textContent = '' }
  </script>
</body>
</html>
